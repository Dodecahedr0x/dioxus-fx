[package]
name = "gallery"
description = "Showcase stories for every dioxus-fx component."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-fx = { workspace = true }
dioxus-showcase = "0.0.7"
# The crate behind https://dioxuslabs.com/components. Only 0.0.0 — a placeholder
# — is on crates.io, so the `primitives` stories build against the repository,
# pinned to a revision. The library itself does not depend on it: the add-on is
# a stylesheet keyed on the data attributes these components already emit.
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955" }
