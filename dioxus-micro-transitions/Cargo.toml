[package]
name = "dioxus-micro-transitions"
description = "155+ reusable, dependency-free micro-interaction and transition components for Dioxus: loaders, spinners, text reveals, entrance animations, hover and cursor effects."
keywords = ["dioxus", "animation", "components", "ui", "loader"]
categories = ["gui", "web-programming", "wasm"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dioxus = { workspace = true }

[features]
default = ["loading", "text", "entrance", "hover", "cursor", "scroll", "buttons", "cards"]
loading = []
text = []
entrance = []
hover = []
cursor = []
scroll = []
buttons = []
cards = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
dioxus-ssr = "0.7"
