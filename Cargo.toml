[workspace]
members = ["dioxus-micro-transitions", "example"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dode/dioxus-micro-transitions"
authors = ["dode <hexadecifish@gmail.com>"]

[workspace.dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "signals", "html", "hooks", "document"] }
dioxus-micro-transitions = { path = "dioxus-micro-transitions", version = "0.1.0" }
